name: 每日更新市值数据并部署

on:
  schedule:
    # UTC 00:30 = 北京时间 08:30，跟本地 crontab 保持一致
    - cron: "30 0 * * *"
  workflow_dispatch: {}  # 手动触发，方便调试
  push:
    branches: [main]  # 代码改动也重新部署一次

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取行情并导出静态 JSON
        run: |
          python -m app.ingest --full
          python -m app.export_static

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data
          git diff --cached --quiet || git commit -m "chore: 每日市值数据更新 $(date -u +%Y-%m-%d)"

      - name: 推送
        run: |
          # 定时触发时上一步可能没有改动、没有提交，push 无内容可推也不会报错。
          # 万一和另一次运行撞车导致远端领先（fetch first 被拒），rebase 后重试一次。
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 失败，尝试 rebase 后重试 ($i/3)"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep 3
          done
          exit 1

      - name: 打包 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
